modules:
  - type: containerfile
    snippets:
      - RUN rpm-ostree install just powerstat
      - COPY --from=ghcr.io/ublue-os/config:latest /rpms/ublue-os-udev-rules.noarch.rpm /
      - COPY --from=ghcr.io/ublue-os/config:latest /rpms/ublue-os-update-services.noarch.rpm /
      - COPY --from=ghcr.io/ublue-os/config:latest /rpms/ublue-os-signing.noarch.rpm /
      - COPY --from=ghcr.io/ublue-os/config:latest /rpms/ublue-os-luks.noarch.rpm /
      - COPY --from=ghcr.io/ublue-os/config:latest /rpms/ublue-os-just.noarch.rpm /
      - RUN rpm -ivh /ublue-os-udev-rules.noarch.rpm
      - RUN rpm -ivh /ublue-os-update-services.noarch.rpm
      - RUN rpm -ivh /ublue-os-signing.noarch.rpm
      - RUN rpm -ivh /ublue-os-luks.noarch.rpm
      - RUN rpm -ivh /ublue-os-just.noarch.rpm
  
  - type: script
    scripts:
      - enableautoupdates.sh # using systemd did not work, so using this script instead
  
  - type: rpm-ostree
    install:
    # environment
      # fuzzy finder
      - fzf
      # power profiles like
      - tuned-ppd
      # xwayland
      - xorg-x11-server-Xwayland
      # headset control
      - headsetcontrol
      # media related
      - mediainfo
      - playerctl
      - alsa-firmware
      # nofitications
      - SwayNotificationCenter
      # text editor
      - neovim
      # tools for evocation
      - just
      # zip utilities
      - p7zip
      # qt libraries
      - qt5-qtwayland
      - qt6-qtwayland
      # emoji fonts
      - google-noto-emoji-fonts
      # vulkan
      - vulkan-tools
      - vulkan-validation-layers


    # polkit
      - polkit
      - polkit-kde
    
    # sound
      - wireplumber
      - pipewire
      - pamixer
      - pulseaudio-utils
    
    # networking
      - network-manager-applet
      - bluez
      - bluez-tools
      - firewall-config
    
    # file manager
      - thunar
      - thunar-archive-plugin
      - thunar-volman
      - xarchiver
      - imv
      - gvfs-mtp
      - gvfs-gphoto2
      - gvfs-smb
      - gvfs-nfs
      - gvfs-fuse
      - gvfs-archive
    
    # theme and GUI
      - fontawesome-fonts-all
      - gnome-themes-extra
      - gnome-icon-theme
      - paper-icon-theme
      - breeze-icon-theme 
      - papirus-icon-theme

  - type: script
    scripts:
      - installproprietarypackages.sh

