modules:
  - type: dnf
    repos:
      copr:
        - ublue-os/packages
    install:
      packages:
        - ublue-os-udev-rules
        - ublue-os-signing
  
  - type: systemd
    system:
      enabled:
        - bootc-fetch-apply-updates.timer
        - podman-auto-update.timer
        - flatpak-system-update.timer
        - notify-update.service
    user:
      enabled:
        - podman-auto-update.timer
        - flatpak-user-update.timer
  
  - type: dnf
    install:
      packages: 
      # environment
        # fuzzy finder
        - fzf
        # power profiles like
        - tuned-ppd
        # xwayland
        - xorg-x11-server-Xwayland
        # headset control
        - headsetcontrol
        # media related
        - mediainfo
        - playerctl
        - alsa-firmware
        # text editor
        - neovim
        # tools for evocation
        - just
        # zip utilities
        - p7zip
        # qt libraries
        - qt5-qtwayland
        - qt6-qtwayland
        # qt ct packages
        - qt5ct
        - qt6ct
        # emoji fonts
        - google-noto-emoji-fonts
        # vulkan
        - vulkan-tools
        - vulkan-validation-layers
      
      # dmenu runner
        - fuzzel

      # polkit
        - polkit
      
      # sound
        - wireplumber
        - pipewire
        - pamixer
        - pulseaudio-utils
      
      # networking
        - bluez
        - bluez-tools
        - firewall-config
      
      # file manager
        - nautilus
        - file-roller
        - file-roller-nautilus
      
      # theme and GUI
        - fontawesome-fonts-all
        - gnome-themes-extra
        - gnome-icon-theme
        - paper-icon-theme
        - breeze-icon-theme 
        - papirus-icon-theme
      
      # power
        - powerstat

    remove:
      packages:
        # remove firefox
        - firefox
        - firefox-langpacks

  - type: dnf
    repos:
      nonfree: rpmfusion
    replace:
      - from-repo: rpmfusion-nonfree
        packages:
          - libheif
          - libva
          - libva-intel-media-driver
          - mesa-dri-drivers
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-va-drivers
          - mesa-vulkan-drivers
          - gstreamer1-plugin-libav
    

