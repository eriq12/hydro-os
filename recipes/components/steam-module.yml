modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      copr:
        enable:
          - atim/xpadneo
    install:
      packages:
        - steam
        # for game mode and big picture mode
        - gamescope
        # for performance view
        - mangohud
        - xpadneo
  
  - type: default-flatpaks
    system:
      install:
        - net.davidotek.pupgui2