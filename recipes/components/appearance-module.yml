    repos:
      copr:
        - peterwu/rendezvous
    install:
      skip-unavailable: true
      packages:
        # emoji fonts
        - google-noto-emoji-fonts
      
        # theme and GUI
        - fontawesome-fonts-all
        - gnome-themes-extra
        - gnome-icon-theme
        - paper-icon-theme
        - breeze-icon-theme 
        - papirus-icon-theme
        - bibata-cursor-themes