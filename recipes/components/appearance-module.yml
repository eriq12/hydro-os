modules:
  - type: dnf
    repos:
      copr:
        - peterwu/rendezvous
        - solopasha/hyprland
    install:
      skip-unavailable: true
      packages:
      # settings apps
        # qt
        - qt5ct
        - qt6ct

        # gtk
        - nwg-look
      
      # Themes and fonts
        # emoji fonts
        - google-noto-emoji-fonts
      
        # theme and GUI
        - fontawesome-fonts-all
        - gnome-themes-extra
        - gnome-icon-theme
        - paper-icon-theme
        - breeze-icon-theme 
        - papirus-icon-theme
        - bibata-cursor-themes