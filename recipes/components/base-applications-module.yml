modules:
  - type: dnf
    repos:
      copr:
        - taw/joplin
    install:
      skip-unavailable: true
      packages:
        # fuzzy finder
        - fzf
      
        # dmenu runner
        - fuzzel
      
        # file manager
        - nautilus
        - file-roller
        - file-roller-nautilus

        # text editor
        - neovim
      
        # software store
        - gnome-software

        # disk management
        - gnome-disk-utility

        # kdeconnect
        - kde-connect

        # note taking software
        - joplin