modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
      files:
        - codium.repo
        - https://openrazer.github.io/hardware:razer.repo
      copr:
        - ublue-os/packages
        - solopasha/hyprland
        - peterwu/rendezvous
      keys:
        - https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/-/raw/master/pub.gpg
    install:
      packages:
      # sddm
        - sddm
        - sddm-themes
        - qt5-qtgraphicaleffects
        - qt5-qtquickcontrols2
        - qt5-qtsvg

      # password keeper
        - kf6-kwallet
        - kwalletmanager
        - pam-kwallet
      
      # hyprland
        - aquamarine
        - hyprland-git
        - hyprpanel
        - hyprpolkitagent
        - hyprshot
        - hyprland-qt-support
        - hyprland-qtutils

      # ublue udev rules and signing
        - ublue-os-udev-rules
        - ublue-os-signing
      
      # environment
        # xwayland
        - xorg-x11-server-Xwayland
        # headset control
        - headsetcontrol
        # media related
        - mediainfo
        - playerctl
        - alsa-firmware
        # zip utilities
        - p7zip
        # qt libraries
        - qt5-qtwayland
        - qt6-qtwayland
        # vulkan
        - vulkan-tools
        - vulkan-validation-layers
        # xdg-desktop-portals
        - xdg-desktop-portal
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-kde

        # polkit
        - polkit
        - polkit-kde
      
        # sound
        - wireplumber
        - pipewire
        - headsetcontrol
      
        # networking
        - bluez
        - bluez-tools
        - firewall-config
      
      # applications
        # fuzzy finder
        - fzf
      
        # dmenu runner
        - fuzzel
      
        # file manager
        - dolphin
        - dolphin-plugins
        - ark

        - ffmpegthumbnailer

        # text editor
        - neovim
        - codium
      
        # software store
        - plasma-discover
        - plasma-discover-flatpak

        # disk management
        - kde-partitionmanager

        # kdeconnect
        - kde-connect
      
      # settings apps
        # qt
        - qt5ct
        - qt6ct

        # gtk
        - nwg-look
      
      # Themes and fonts
        # emoji fonts
        - google-noto-emoji-fonts
      
        # theme and GUI
        - fontawesome-fonts-all
        - gnome-themes-extra
        - papirus-icon-theme
        - bibata-cursor-themes

      # zsh
        - zsh
        # zoxide for z stuff
        - zoxide

      # steam
        - steam
        # for game mode and big picture mode
        - gamescope
        # for performance view
        - mangohud
        # dkms for xpadneo and open razer
        - dkms
        - openrazer-meta
      
      # simple editing softare
        - avidemux

      # other multimedia
        - gstreamer1-plugin-libav
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-vaapi
  
    remove:
      packages:
        # remove firefox
        - firefox
        - firefox-langpacks

        # old codecs
        - fdk-aac-free
        - libavcodec-free
        - libavdevice-free
        - libavfilter-free
        - libavformat-free
        - libavutil-free
        - libpostproc-free
        - libswresample-free
        - libswscale-free 
        - ffmpeg-free

    replace:
      - from-repo: rpmfusion-free-updates
        packages:
          - old: mesa-va-drivers
            new: mesa-va-drivers-freeworld
    
  - type: dnf
    install:
      packages:
        - ffmpeg
        - mesa-vdpau-drivers-freeworld

  - type: dnf
    repos:
      files:
        - https://negativo17.org/repos/fedora-steam.repo
    install:
      packages:
        - repo: fedora-steam
          packages:
            - dkms-xpadneo

  - type: script
    scripts:
      - installdkmsmodules.sh