modules:
  - type: dnf
    repos:
      copr:
        - ublue-os/packages
    install:
      packages:
        - ublue-os-udev-rules
        - ublue-os-signing

  - type: script
    scripts:
      - addimageinfo.sh

  - type: systemd
    system:
      enabled:
        - bootc-fetch-updates.timer
        - flatpak-system-update.timer
    user:
      enabled:
        - flatpak-user-update.timer

  - type: dnf
    install:
      packages: 
      # environment
        # power profiles like
        - tuned-ppd
        # xwayland
        - xorg-x11-server-Xwayland
        # headset control
        - headsetcontrol
        # media related
        - mediainfo
        - playerctl
        - alsa-firmware
        # tools for evocation
        - just
        # zip utilities
        - p7zip
        # qt libraries
        - qt5-qtwayland
        - qt6-qtwayland
        # vulkan
        - vulkan-tools
        - vulkan-validation-layers

      # polkit
        - polkit
      
      # sound
        - wireplumber
        - pipewire
        - pamixer
        - pulseaudio-utils
      
      # networking
        - bluez
        - bluez-tools
        - firewall-config
      
      # power
        - powerstat

    remove:
      packages:
        # remove firefox
        - firefox
        - firefox-langpacks

  - type: dnf
    repos:
      nonfree: rpmfusion
    replace:
      - from-repo: rpmfusion-nonfree
        packages:
          - libheif
          - libva
          - libva-intel-media-driver
          - mesa-dri-drivers
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-va-drivers
          - mesa-vulkan-drivers
          - gstreamer1-plugin-libav
    

