modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - akmod-nvidia
    
  - type: script
    scripts:
      - nvidia/setdrmvariables.sh

  - type: systemd
    system:
      enabled:
        - nvidia-suspend.service
        - nvidia-hibernate.service
        - nvidia-resume.service