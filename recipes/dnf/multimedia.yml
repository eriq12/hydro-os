modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
      # other multimedia
        - gstreamer1-plugin-libav
        - gstreamer1-plugins-bad-free-extras
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-vaapi
  
    remove:
      packages:
        # old codecs
        - fdk-aac-free
        - libavcodec-free
        - libavdevice-free
        - libavfilter-free
        - libavformat-free
        - libavutil-free
        - libpostproc-free
        - libswresample-free
        - libswscale-free 
        - ffmpeg-free

    replace:
      - from-repo: rpmfusion-free-updates
        packages:
          - old: mesa-va-drivers
            new: mesa-va-drivers-freeworld
    
  - type: dnf
    install:
      packages:
        - ffmpeg
        - mesa-vdpau-drivers-freeworld
