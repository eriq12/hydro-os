# ~/.config/pipewire/pipewire.conf.d/104-group-game-audio-to-node.conf

node.rules = [
  {
    matches = [
      {
        pipewire.access.portal.app_id = "io.github.equicord.equibop"
      }
    ]
    actions = {
      update-props = {
        application.name = "Freetube"
        node.name = "Freetube"
      }
    }
  }
]
